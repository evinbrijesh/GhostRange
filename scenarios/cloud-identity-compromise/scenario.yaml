# GhostRange scenario fixture — Cloud Identity Compromise v1
#
# SAFETY: everything here is fictional. Northwind Analytics, its identities,
# resources, and all IP addresses (reserved documentation ranges) do not exist.
# Every generated event is marked synthetic: true. This fixture never touches
# real cloud providers.

id: cloud-identity-compromise-v1
name: Cloud Identity Compromise
version: "1.0.0"
seed: 1337
synthetic_only: true

description: >
  A fictional identity at Northwind Analytics (a fictional company) is
  compromised and progresses through seven attack stages: initial access with
  valid credentials from an unusual location, MFA manipulation, discovery,
  privilege escalation, persistence, sensitive access, and data staging.

environment:
  organization: Northwind Analytics (fictional)
  compromised_identity: user-alice-morgan
  note: >
    Reserved documentation IP ranges only: 192.0.2.0/24 (office),
    198.51.100.0/24 (internal), 203.0.113.0/24 (unusual/external).

# Stage weights must sum to 1.0. The coverage formula (coverage-v1) scores
# detected=1.0, partial=0.5, missed=0.0, error=0.0 per stage.
stages:
  - id: S1
    name: Initial access
    description: Valid credentials are used from an unusual location.
    weight: 0.15
  - id: S2
    name: MFA manipulation
    description: An MFA method or security setting is changed for the compromised identity.
    weight: 0.10
  - id: S3
    name: Discovery
    description: Roles, users, and storage resources are enumerated.
    weight: 0.10
  - id: S4
    name: Privilege escalation
    description: A low-privilege identity receives an admin-capable role and then assumes it.
    weight: 0.20
  - id: S5
    name: Persistence
    description: A long-lived access key is created for the compromised identity.
    weight: 0.15
  - id: S6
    name: Sensitive access
    description: Protected object storage is accessed.
    weight: 0.15
  - id: S7
    name: Data staging
    description: Data is listed and copied to a staging location in preparation for transfer.
    weight: 0.15
